<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper · 组会文献阅读</title><link rel="stylesheet" href="style.css"><body><main><header><span>PAPER / RESEARCH LOG</span><span id="identity">组会文献阅读系统</span></header><h1>读懂一篇，向前一步。</h1><p>记录研究动机、模型与发现，让组会讨论有据可循。</p><div id="notice" role="status" aria-live="polite"></div><section id="login"><h2>邮箱登录</h2><p>验证邮箱后可提交阅读记录。查看其他人的记录需要管理员授权。</p><form id="loginForm"><label>邮箱<input id="email" type="email" required autocomplete="email"></label><button>发送登录链接</button></form></section><div id="workspace" hidden><nav><button data-tab="submit">提交阅读</button><button data-tab="records">阅读记录</button><button id="adminTab" data-tab="admin" hidden>查看授权</button><button id="logout">退出登录</button></nav><section id="submit"><h2>新的阅读记录</h2><form id="paperForm"><div class="columns"><label>名字<input name="reader_name" maxlength="100" required></label><label>阅读 / 组会日期<input name="reading_date" type="date" required></label><label class="full">文章题目<input name="title" maxlength="500" required></label><label>发表年份<input name="publication_year" type="number" min="1500" max="2200" required></label><label>发表期刊<input name="journal" maxlength="300" required></label></div><label>中文摘要<textarea name="abstract_zh" rows="5" maxlength="20000" required></textarea></label><label>作者为什么做这个模型（作者原话）<textarea name="motivation_quote" rows="5" maxlength="20000" required placeholder="粘贴作者原话，建议附章节或页码"></textarea></label><label>模型<textarea name="model" rows="5" maxlength="20000" required placeholder="模型结构、假设、方程或方法"></textarea></label><label>主要结论<textarea name="conclusions" rows="5" maxlength="20000" required></textarea></label><label>上传图片（最多 6 张，每张不超过 5 MB）<input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="previews"></div><button id="submitButton">提交阅读记录</button></form></section><section id="records" hidden><div class="row"><h2>阅读记录</h2><button id="refresh">刷新</button></div><p id="scope"></p><label>搜索题目、名字或期刊<input id="search" type="search" placeholder="输入关键词"></label><div id="recordList"></div></section><section id="admin" hidden><h2>查看权限管理</h2><p>授权邮箱可查看全部阅读记录及图片；未授权成员仅能查看本人记录。撤销后，新请求立即生效。</p><form id="grantForm"><label>授权查看的邮箱<input id="grantEmail" type="email" required></label><button>授予查看权限</button></form><div id="grantList"></div></section></div><footer>原文引用请保留出处 · 图片与记录存储在私有数据库中</footer></main><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
